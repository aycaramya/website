<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact — sisyphus</title>
<link rel="stylesheet" href="css/sisyphus.css">
</head>

<body class="standalone">

<main class="page-shell">

  <nav class="bar">
    <a href="index.html">home</a>
    <a href="sisyphus.html">sisyphus</a>
    <a href="https://album.link/hysteresis">hysteresis</a>
    <a href="https://elasticstage.com/soundcloud/releases/ramya-hysteresis-album">vinyl</a>
  </nav>

  <div class="lower">
    <section class="box" id="contact">
      <h2>contact</h2>
      <div class="inner">
        <p class="contact-blurb">for booking, collabs, or just to say hi, drop a note below.</p>
        <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <label class="hp-field" aria-hidden="true">
            leave this field blank
            <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
          </label>
          <input type="text" name="name" placeholder="name" autocomplete="name" required>
          <input type="email" name="_replyto" placeholder="your email" autocomplete="email" required>
          <textarea name="message" placeholder="message" required></textarea>
          <button type="submit">send</button>
        </form>
        <p id="contact-status" role="status"></p>
        <p class="contact-fallback">prefer email? <a href="#" class="js-email" data-user="ramya09" data-domain="gmail.com">click here</a></p>
      </div>
    </section>
  </div>

</main>

<script src="js/contact.js"></script>

</body>
</html>
